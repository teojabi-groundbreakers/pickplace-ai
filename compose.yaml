name: pickplace-ai

services:
  ai-api:
    build: .
    restart: unless-stopped
    expose:
      - "8000"
    environment:
      PICKPLACE_MODEL_DIR: /app/artifacts/current
      PICKPLACE_API_KEY: ${PICKPLACE_API_KEY:?Set an internal AI API key}
      PICKPLACE_REQUIRE_API_KEY: "true"
      PICKPLACE_ALLOW_SYNTHETIC: "false"
      PICKPLACE_ALLOW_EXPERIMENTAL: "false"
      OMP_NUM_THREADS: "1"
      OPENBLAS_NUM_THREADS: "1"
    volumes:
      - ./artifacts:/app/artifacts:ro
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64m
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    mem_limit: 1g
    cpus: 1
    networks:
      - ai-internal

networks:
  ai-internal:
    name: pickplace-ai-internal
    internal: true
